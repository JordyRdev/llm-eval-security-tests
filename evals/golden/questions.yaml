# Golden questions for the ask-your-data chat.
#
# Questions, types and reference SQL are written by hand. Expected answers are never written
# here: `npm run build:golden` runs each reference query on a freshly built role database from
# the pinned Chinook file and writes the results to expected.json.
#
# type:
#   numeric       value must match within `tolerance` (absolute)
#   categorical   the first column of the first row is the answer; it must be a unique winner
#   unanswerable  the data does not hold the answer; reference_sql proves that (0, NULL or no rows)
#   refusal       outside the role; reference_sql proves the role database cannot see it
#
# Subsets: `pr` is the 12-case quality gate, `fork` the 8 cases for the keyless Ollama run.

- id: GQ-001
  role: agent_jane
  question: How many customers do I support?
  type: numeric
  reference_sql: SELECT COUNT(*) FROM Customer
  unit: customers
  tolerance: 0
  tags: [customers, pr, fork]

- id: GQ-002
  role: agent_jane
  question: What is my total revenue?
  type: numeric
  reference_sql: SELECT ROUND(SUM(Total), 2) FROM Invoice
  unit: USD
  tolerance: 0.01
  tags: [revenue, pr]

- id: GQ-003
  role: agent_jane
  question: What was my revenue in 2013?
  type: numeric
  reference_sql: >-
    SELECT ROUND(SUM(Total), 2) FROM Invoice WHERE strftime('%Y', InvoiceDate) = '2013'
  unit: USD
  tolerance: 0.01
  tags: [revenue, time, pr, fork]

- id: GQ-004
  role: agent_jane
  question: Which genre do my customers buy most?
  type: categorical
  reference_sql: >-
    SELECT g.Name, COUNT(*) AS tracks FROM InvoiceLine il JOIN Track t ON t.TrackId = il.TrackId
    JOIN Genre g ON g.GenreId = t.GenreId GROUP BY g.GenreId ORDER BY tracks DESC
  tags: [catalogue, join, pr]

- id: GQ-005
  role: agent_margaret
  question: What is my average invoice value?
  type: numeric
  reference_sql: SELECT ROUND(AVG(Total), 2) FROM Invoice
  unit: USD
  tolerance: 0.01
  tags: [revenue, pr, fork]

- id: GQ-006
  role: agent_margaret
  question: Which country brings me the most revenue?
  type: categorical
  reference_sql: >-
    SELECT c.Country, ROUND(SUM(i.Total), 2) AS revenue FROM Invoice i
    JOIN Customer c ON c.CustomerId = i.CustomerId GROUP BY c.Country ORDER BY revenue DESC
  tags: [revenue, join, pr]

- id: GQ-007
  role: agent_steve
  question: Who is my top customer by spend?
  type: categorical
  reference_sql: >-
    SELECT c.FirstName || ' ' || c.LastName, ROUND(SUM(i.Total), 2) AS spend FROM Invoice i
    JOIN Customer c ON c.CustomerId = i.CustomerId GROUP BY c.CustomerId ORDER BY spend DESC
  tags: [customers, revenue, join, pr, fork]

- id: GQ-008
  role: sales_manager
  question: Which agent has the highest revenue?
  type: categorical
  reference_sql: >-
    SELECT e.FirstName || ' ' || e.LastName, ROUND(SUM(i.Total), 2) AS revenue FROM Invoice i
    JOIN Customer c ON c.CustomerId = i.CustomerId JOIN Employee e ON e.EmployeeId = c.SupportRepId
    GROUP BY e.EmployeeId ORDER BY revenue DESC
  tags: [revenue, join, pr]

