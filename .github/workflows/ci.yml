name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck:
    name: lint-typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

  unit:
    name: unit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Verify pinned dataset checksum
        run: npm run verify:data
      - name: Build role databases
        run: npm run build:db
      - name: Check golden answers against the database
        run: npm run build:golden -- --check
      - run: npm test

  # Full golden set (40 cases) with recorded app replies and judge verdicts: no model, no key,
  # so it also runs for forks. Fails on errors, replay misses or any per-case score that differs
  # from the committed baseline. Thresholds are reported here and enforced from phase 4.
  eval-replay:
    name: eval-replay
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Build role databases
        run: npm run build:db
      - name: Golden set with replay
        run: npm run eval:replay

  # Runs the 8-case fork subset of the golden set through the real pipeline against a local
  # open model, without any secret (about 23 s per case on a hosted runner). Accuracy is
  # reported against the 60 % target; the job fails only when the pipeline breaks.
  ollama-smoke:
    name: ollama-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LLM_PROVIDER: ollama
      OLLAMA_MODEL: qwen3:4b
      OLLAMA_MODELS: /home/runner/.ollama/models
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          sudo systemctl stop ollama || true
          ollama --version
      - name: Cache model
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: /home/runner/.ollama/models
          key: ollama-${{ env.OLLAMA_MODEL }}-v1
      - name: Start Ollama and pull the model
        run: |
          mkdir -p "$OLLAMA_MODELS"
          nohup ollama serve > "$RUNNER_TEMP/ollama.log" 2>&1 &
          for _ in $(seq 1 30); do curl -fsS http://127.0.0.1:11434/api/version && break; sleep 1; done
          ollama pull "$OLLAMA_MODEL"
      - name: Load the model into memory
        run: |
          start=$(date +%s%N)
          curl -fsS http://127.0.0.1:11434/api/generate \
            -d "{\"model\":\"$OLLAMA_MODEL\",\"prompt\":\"\",\"keep_alive\":\"30m\"}" > /dev/null
          echo "Model load took $(( ($(date +%s%N) - start) / 1000000 )) ms" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Build role databases
        run: npm run build:db
      - name: Golden fork subset
        env:
          EVAL_SUBSET: fork
          EVAL_JUDGE: "0"
        run: |
          npm run eval
          npm run eval:summary -- --subset fork --title "Golden fork subset (Ollama $OLLAMA_MODEL)"
      - name: Ollama log
        if: failure()
        run: tail -n 100 "$RUNNER_TEMP/ollama.log"
